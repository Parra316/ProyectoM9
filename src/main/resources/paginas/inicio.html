<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<style>
    .card {
        border: none;
        transition: all 500ms cubic-bezier(0.19, 1, 0.22, 1);
        overflow: hidden;
        border-radius: 20px;
        min-height: 450px;
        box-shadow: 0 0 12px 0 rgba(0, 0, 0, 0.2);
    }
    .card-has-bg {
        background-size: 120%;
        background-repeat: no-repeat;
        background-position: center center;
        position: relative;
    }
    .card-has-bg:hover {
        transform: scale(0.98);
        background-size: 130%;
    }
    .card-img-overlay {
        background: linear-gradient(0deg, rgba(255, 186, 33, 0.5) 0%, rgba(255, 186, 33, 1) 100%);
        color: #000;
    }
    .card-title {
        font-weight: 800;
    }
    .card-meta {
        color: rgba(0, 0, 0, 1);
        text-transform: uppercase;
        font-weight: 500;
        letter-spacing: 2px;
    }
    .card-footer {
        background: none;
        border-top: none;
    }
    .card-footer img {
        border: solid 3px rgba(255, 255, 255, 0.3);
    }
</style>
<div th:replace="~{plantillas/plantilla :: body}"></div>
<!-- Contenido adicional -->
<main class="container text-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
    <h1 th:text="${page}"></h1>
</main>
<div class="container mt-4">
    <h1 class="text-white">Bienvenido a Kira Massage</h1>
    <p class="text-white">Relájate y disfruta de nuestros servicios de masajes profesionales.</p>
    <div class="row">
        <div th:each="servicio : ${servicios}" class="col-sm-12 col-md-6 col-lg-4 mb-4">
            <div class="card text-dark card-has-bg click-col"
                 th:style="'background-image: url(https://www.dondeir.com/wp-content/uploads/2017/01/los-mejores-masajes-relajantes-de-la-ciudad-de-mexico-2.jpg)'">
                <div class="card-img-overlay d-flex flex-column">
                    <div class="card-body">
                        <small class="card-meta mb-2">Servicio</small>
                        <h4 class="card-title mt-0" th:text="${servicio.nombre}">Nombre del servicio</h4>
                        <p th:text="${servicio.descripcion}">Descripción del servicio</p>
                        <p>
                            Duración: <span th:text="${servicio.duracion} + ' minutos'">60 minutos</span><br>
                            Precio: <span th:text="'$' + ${servicio.precio} + ' MXN'">$500 MXN</span>
                        </p>
                    </div>
                    <div class="card-footer mt-auto">
                        <a th:href="@{/citas(servicioId=${servicio.idServicio}, servicioPrecio=${servicio.precio})}" class="btn btn-dark">
                            Seleccionar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
